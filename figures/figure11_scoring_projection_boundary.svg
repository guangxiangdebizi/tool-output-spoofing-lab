<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #17202a; }
      .subtitle { font: 13px Arial, sans-serif; fill: #4f5b66; }
      .label { font: 700 14px Arial, sans-serif; fill: #17202a; }
      .small { font: 12px Arial, sans-serif; fill: #243447; }
      .tiny { font: 10px Arial, sans-serif; fill: #243447; }
      .box { stroke: #243447; stroke-width: 1.3; rx: 10; ry: 10; }
      .green { fill: #dff5e3; }
      .blue { fill: #dcecff; }
      .yellow { fill: #fff0c9; }
      .red { fill: #ffe0df; }
      .purple { fill: #eadfff; }
      .gray { fill: #f0f2f5; }
      .hidden { stroke: #c0392b; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .arrow { stroke: #243447; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="470" fill="#ffffff"/>
<text x="40" y="36" class="title">Scoring pipeline and restricted read-back projection boundary</text>
<text x="40" y="58" class="subtitle">Projection scoring is allowed only for declared read-back paths; hidden oracle/raw results remain forbidden.</text>
<rect x="45" y="95" width="225" height="125" class="box blue"/>
<text x="59" y="119" class="label">Primary truthful result y</text>
<text x="59" y="141" class="small">canonical fields</text>
<text x="59" y="158" class="small">e.g. content/status/id</text>
<text x="59" y="175" class="small">exact-primary target</text>
<rect x="45" y="275" width="225" height="125" class="box red"/>
<text x="59" y="299" class="label">Forbidden sources</text>
<text x="59" y="321" class="small">hidden oracle context</text>
<text x="59" y="338" class="small">raw tool result</text>
<text x="59" y="355" class="small">ground-truth plan</text>
<text x="59" y="372" class="small">never prompt-visible</text>
<rect x="330" y="95" width="245" height="125" class="box yellow"/>
<text x="344" y="119" class="label">Model claimed fields</text>
<text x="344" y="141" class="small">claimed_fields[k]</text>
<text x="344" y="158" class="small">commit vs uncertainty</text>
<text x="344" y="175" class="small">action_commit flag</text>
<rect x="655" y="95" width="260" height="125" class="box green"/>
<text x="669" y="119" class="label">Exact-primary score</text>
<text x="669" y="141" class="small">claim == truthful[k]</text>
<text x="669" y="158" class="small">strict object/field shape</text>
<text x="669" y="175" class="small">clean_utility_exact</text>
<rect x="330" y="285" width="245" height="135" class="box purple"/>
<text x="344" y="309" class="label">Read-back validator</text>
<text x="344" y="331" class="small">split-channel observation</text>
<text x="344" y="348" class="small">content_verified=true</text>
<text x="344" y="365" class="small">visible validator_call</text>
<rect x="655" y="285" width="260" height="135" class="box green"/>
<text x="669" y="309" class="label">Restricted projection</text>
<text x="669" y="331" class="small">pre-declared object path</text>
<text x="669" y="348" class="small">value/text/wifi_enabled</text>
<text x="669" y="365" class="small">records[*].declared keys</text>
<text x="669" y="382" class="small">clean_utility_semantic</text>
<rect x="975" y="185" width="175" height="125" class="box gray"/>
<text x="989" y="209" class="label">Reported metrics</text>
<text x="989" y="231" class="small">ASR / AFS</text>
<text x="989" y="248" class="small">CU exact + semantic</text>
<text x="989" y="265" class="small">projection paths</text>
<text x="989" y="282" class="small">API/parse errors</text>
<path d="M 270 157 L 330 157" class="arrow"/>
<path d="M 575 157 L 655 157" class="arrow"/>
<path d="M 575 350 L 655 350" class="arrow"/>
<path d="M 915 157 L 975 220" class="arrow"/>
<path d="M 915 350 L 975 260" class="arrow"/>
<path d="M 270 337 L 330 337" stroke="#c0392b" stroke-width="1.7" stroke-dasharray="6 5"/>
<text x="92" y="425" class="tiny" fill="#c0392b">forbidden: no oracle/raw/ground-truth access to projection scorer</text>
<path d="M 300 260 L 945 260" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="340" y="252" class="tiny" fill="#c0392b">projection boundary: no arbitrary recursive matching, no oracle/raw access</text>
<text x="47" y="445" class="small">Paper rule: projection scores pre-declared semantically equivalent read-back claims only; it must not change spoofed ASR.</text>
</svg>
