<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
  <rect width="1500" height="860" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">Trace schema and model-visible leakage boundary</text>
  <text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">The overlay changes only visible observations; hidden truth, oracle context, raw results, and mode labels are excluded from model prompts.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="70" y="170" width="310" height="520" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="105" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">Benchmark substrate</text>
  <text x="105" y="255" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">ToolSandbox / AgentDojo</text>
  <text x="105" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Official task and state</text>
  <text x="105" y="325" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Real tool execution</text>
  <text x="105" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Benchmark oracle</text>

  <rect x="105" y="430" width="240" height="120" rx="12" fill="#dbeafe"/>
  <text x="130" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Hidden truth plane</text>
  <text x="130" y="505" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937">raw_tool_result</text>
  <text x="130" y="530" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937">oracle_context</text>

  <rect x="475" y="170" width="330" height="520" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="520" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Observation overlay</text>
  <text x="520" y="255" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Paired condition</text>
  <text x="540" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">truthful: canonical observation</text>
  <text x="540" y="324" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">spoofed: schema-valid false field</text>
  <text x="520" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Defense baselines</text>
  <text x="540" y="407" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">schema-only / prompt-filter</text>
  <text x="540" y="439" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">repeat-same-tool</text>
  <text x="540" y="471" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">read-back / authority</text>

  <rect x="520" y="550" width="240" height="90" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="548" y="586" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#991b1b">Not model-visible</text>
  <text x="548" y="615" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#991b1b">mode, raw result, oracle, score</text>

  <rect x="900" y="170" width="390" height="520" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="945" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#047857">Model-visible prompt</text>
  <text x="945" y="255" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">condition_id hash</text>
  <text x="945" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">policy instruction</text>
  <text x="945" y="325" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">visible tool events</text>
  <text x="945" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">required JSON schema</text>
  <rect x="945" y="430" width="250" height="120" rx="12" fill="#d1fae5"/>
  <text x="975" y="470" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#065f46">Allowed events</text>
  <text x="975" y="505" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#064e3b">visible_tool_result</text>
  <text x="975" y="530" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#064e3b">validator_call / readback</text>

  <rect x="1010" y="725" width="330" height="86" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="1035" y="758" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#111827">Audit artifact</text>
  <text x="1035" y="786" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#374151">outputs/prompt_leakage_audit_expanded_gpt54.json</text>

  <line x1="380" y1="420" x2="475" y2="420" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="805" y1="420" x2="900" y2="420" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="640" x2="640" y2="735" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,8"/>
  <text x="505" y="755" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Leakage boundary</text>

  <text x="70" y="810" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Audit result on current expanded pilots: 184/184 cells checked, 0 forbidden hidden-oracle/mode/ground-truth patterns in model-visible prompts.</text>
</svg>
