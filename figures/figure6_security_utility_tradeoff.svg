<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">Pilot security-utility tradeoff</text>
  <text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">Lower spoofed ASR and higher truthful utility are better. Points are pilot evidence only, not final benchmark claims.</text>

  <defs>
    <marker id="axisArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="120" y="165" width="940" height="650" fill="#f9fafb" stroke="#d1d5db"/>
  <line x1="120" y1="815" x2="1080" y2="815" stroke="#111827" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="120" y1="815" x2="120" y2="165" stroke="#111827" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="410" y="860" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">Truthful clean utility</text>
  <text x="18" y="500" transform="rotate(-90 18 500)" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">Spoofed ASR</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="120" y1="685" x2="1060" y2="685"/><line x1="120" y1="555" x2="1060" y2="555"/><line x1="120" y1="425" x2="1060" y2="425"/><line x1="120" y1="295" x2="1060" y2="295"/>
    <line x1="312" y1="165" x2="312" y2="815"/><line x1="504" y1="165" x2="504" y2="815"/><line x1="696" y1="165" x2="696" y2="815"/><line x1="888" y1="165" x2="888" y2="815"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#374151">
    <text x="110" y="835">0</text><text x="300" y="835">0.25</text><text x="492" y="835">0.5</text><text x="684" y="835">0.75</text><text x="878" y="835">1.0</text>
    <text x="80" y="820">0</text><text x="68" y="690">0.2</text><text x="68" y="560">0.4</text><text x="68" y="430">0.6</text><text x="68" y="300">0.8</text><text x="68" y="170">1.0</text>
  </g>

  <rect x="810" y="190" width="230" height="70" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text x="835" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#065f46">Target region</text>
  <text x="835" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#065f46">low ASR, high utility</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14">
    <circle cx="760" cy="382" r="9" fill="#ef4444"/><text x="775" y="387" fill="#111827">TS naive 4/6, 4/6</text>
    <circle cx="760" cy="273" r="9" fill="#f97316"/><text x="775" y="278" fill="#111827">TS repeat 5/6, 4/6</text>
    <circle cx="1080" cy="815" r="9" fill="#22c55e"/><text x="955" y="800" fill="#111827">TS read-back 0/6, 6/6</text>
    <circle cx="760" cy="815" r="9" fill="#3b82f6"/><text x="775" y="820" fill="#111827">TS independent 0/6, 4/6</text>

    <rect x="520" y="490" width="18" height="18" fill="#ef4444"/><text x="548" y="505" fill="#111827">AD naive 2/4, 1/4</text>
    <rect x="760" y="490" width="18" height="18" fill="#f97316"/><text x="788" y="505" fill="#111827">AD repeat 2/4, 2/4</text>
    <rect x="1080" y="815" width="18" height="18" fill="#22c55e"/><text x="1090" y="805" fill="#111827">AD read-back 0/4, 4/4</text>
    <rect x="760" y="815" width="18" height="18" fill="#3b82f6"/><text x="788" y="790" fill="#111827">AD independent 0/4, 2/4</text>

    <polygon points="1080,555 1090,575 1070,575" fill="#ef4444"/><text x="1100" y="572" fill="#111827">Local naive 4/8, 8/8</text>
    <polygon points="960,555 970,575 950,575" fill="#f97316"/><text x="980" y="572" fill="#111827">Local repeat 4/8, 7/8</text>
    <polygon points="960,815 970,835 950,835" fill="#3b82f6"/><text x="980" y="832" fill="#111827">Local independent 0/8, 7/8</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827">
    <rect x="1120" y="180" width="300" height="170" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="1145" y="215" font-weight="700">Legend</text>
    <circle cx="1148" cy="250" r="8" fill="#111827"/><text x="1170" y="255">ToolSandbox</text>
    <rect x="1140" y="278" width="16" height="16" fill="#111827"/><text x="1170" y="293">AgentDojo</text>
    <polygon points="1148,315 1158,333 1138,333" fill="#111827"/><text x="1170" y="330">Local regression</text>
  </g>

  <text x="120" y="885" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">Coordinates use current gpt-5.4-mini pilot aggregates; read-back utility uses the restricted projection ablation reported in outputs/readback_scoring_ablation.json.</text>
</svg>
